name: Collect stats

# Once a day, late evening India time, save the day's audience numbers (website, Instagram) to
# data/stats/<date>.json for the control dashboard. A platform without its secret is recorded as "off".
# Secrets (Settings > Secrets and variables > Actions): GOATCOUNTER_TOKEN, INSTAGRAM_TOKEN.

on:
  schedule:
    - cron: "0 18 * * *"      # 18:00 UTC = 23:30 India time; clock.yml starts it on time, this cron is a backup
  workflow_dispatch:

permissions:
  contents: write             # commit data/stats

concurrency:
  group: collect-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: python -m fma.stats collect
      # The learning loop (fma/learn.py): rebuild what our numbers say; on Sundays also this week's producer lessons.
      # Never blocks the stats.
      - name: Learn
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ "$(TZ=Asia/Kolkata date +%u)" = "7" ]; then python -m fma.learn update --lessons; else python -m fma.learn update; fi             || echo "::warning::learning loop failed; the stats are saved"
      # Sundays: which AI Shorts people watched this week on YouTube (US and India), as hook ideas (fma/market.py).
      - name: Market scout
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ "$(TZ=Asia/Kolkata date +%u)" = "7" ]; then python -m fma.market; fi || echo "::warning::market scout failed"
      # The growth scoreboard (fma/growth.py, docs/growth-strategy.md): the week's funnel against the plan's targets.
      - name: Growth scoreboard
        run: python -m fma.growth || echo "::warning::growth scoreboard failed; the stats are saved"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats data/learning data/learned.json data/growth 2>/dev/null || git add data/stats
          git diff --cached --quiet && exit 0
          git commit -m "Stats for $(TZ=Asia/Kolkata date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
