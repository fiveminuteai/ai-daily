name: Publish social

# Started by the control dashboard (workflow_dispatch) when Pavan approves or skips a social item.
# Approve on Instagram posts the day's carousel through the Graph API (secret INSTAGRAM_TOKEN); LinkedIn is
# marked approved for posting by hand; X is refused until its paid API is switched on. The result (posted link,
# skipped, or failed with the reason) is committed to data/social/<date>.json. dry_run: true changes nothing.

on:
  workflow_dispatch:
    inputs:
      item_id:
        description: "Queue item, e.g. 2026-10-30-instagram"
        required: true
        type: string
      action:
        description: "approve or skip"
        required: true
        type: choice
        options: [approve, skip]
      text:
        description: "Edited text (optional; empty keeps the queued text)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Only show what would happen"
        required: false
        type: boolean
        default: false

permissions:
  contents: write             # record the result in data/social

concurrency:
  group: publish-social
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Approve or skip
        env:
          ITEM_ID: ${{ inputs.item_id }}
          ACTION: ${{ inputs.action }}
          TEXT: ${{ inputs.text }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: |
          if [ -n "$TEXT" ]; then
            python -m fma.social_queue act "$ITEM_ID" --action "$ACTION" --text "$TEXT" $DRY
          else
            python -m fma.social_queue act "$ITEM_ID" --action "$ACTION" $DRY
          fi
      - name: Record the result
        if: ${{ always() && !inputs.dry_run }}
        env:
          ITEM_ID: ${{ inputs.item_id }}
          ACTION: ${{ inputs.action }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social
          git diff --cached --quiet && exit 0
          git commit -m "Social: $ACTION $ITEM_ID"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
