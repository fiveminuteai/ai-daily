name: Post scheduled social

# Posts every approved Instagram item whose time has come (data/social/<date>.json, scheduled_at). The story Reels
# are scheduled for 09:00, 13:00 and 19:00 India time; approving in the control app only marks them approved.
# On time comes from clock.yml, which starts this workflow at each slot; GitHub's own scheduler drops runs, so the
# crons below are only backups (and restart the clock if it stopped). An item is posted once: after posting it is
# "posted" and later runs skip it. A failed post is tried again (3 times in this run, 5 in all), and every retry first
# looks for the post on Instagram, so a post that went out despite an error is recorded, never posted twice.

on:
  schedule:
    - cron: "35 3 * * *"      # 09:05 India time
    - cron: "5 4 * * *"       # 09:35, second try
    - cron: "35 7 * * *"      # 13:05
    - cron: "5 8 * * *"       # 13:35
    - cron: "35 13 * * *"     # 19:05
    - cron: "5 14 * * *"      # 19:35
  workflow_dispatch:

permissions:
  contents: write             # record the result in data/social

concurrency:
  group: publish-social       # same lock as approve/skip, so two runs never post the same item
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post what is due
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: |
          for i in 1 2 3; do
            python -m fma.social_queue due && exit 0
            [ "$i" = 3 ] || { echo "Trying the failed post again in 4 minutes"; sleep 240; }
          done
          exit 1
      - name: Record the result
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social
          git diff --cached --quiet && exit 0
          git commit -m "Social: scheduled posts"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1

  # The crons are the clock's backup: if no clock run is going (a lost runner, a GitHub outage), start one.
  clock-watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Restart the clock if it stopped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          going=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow clock.yml --limit 5 --json status -q '[.[] | select(.status != "completed")] | length')
          if [ "$going" = "0" ]; then
            echo "::warning::The clock had stopped; restarting it"
            gh workflow run clock.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "Clock is running"
          fi
