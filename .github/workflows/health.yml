name: Health check

# The daily live check (fma/health.py, 11 Nov 2026): today's post, site pages, rendered media (duo, voice, length),
# the posting queue and Instagram, read-only. A FAIL turns the run red, and GitHub emails the owner; the findings
# are in the run's summary. Twice a day: after the first Reels, and after the 22:30 sweep.

on:
  schedule:
    - cron: "15 7 * * *"     # 12:45 IST
    - cron: "50 17 * * *"    # 23:20 IST
  workflow_dispatch:
    inputs:
      date:
        description: "Day to check (YYYY-MM-DD, default today in India)"
        required: false

permissions:
  contents: read

concurrency:
  group: health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check the day
        env:
          IG_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          DATE: ${{ inputs.date }}
        run: python -m fma.health ${DATE:+--date "$DATE"}
