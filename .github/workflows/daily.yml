name: Daily post

on:
  schedule:
    # On time comes from clock.yml, which starts this workflow at 05:45 India time; these crons are backups.
    # GitHub's scheduler is best effort: it delays runs and sometimes drops them (31 Oct 2026 lost
    # both morning runs). So there are many tries, at odd minutes away from the busy top of the hour.
    # Once the day's post exists the rest skip themselves in seconds, so only one post goes out.
    - cron: "15 0 * * *"      # 05:45 India time, the main run
    - cron: "47 0 * * *"      # 06:17
    - cron: "23 1 * * *"      # 06:53
    - cron: "53 1 * * *"      # 07:23
    - cron: "29 2 * * *"      # 07:59
    - cron: "7 3 * * *"       # 08:37
    - cron: "43 3 * * *"      # 09:13
    - cron: "19 4 * * *"      # 09:49
    - cron: "11 5 * * *"      # 10:41
    - cron: "37 6 * * *"      # 12:07, last try; raises the alert below if there is still no post
  workflow_dispatch:          # "Run workflow" button for a manual run

permissions:
  contents: write             # commit the new post
  pages: write                # deploy the site
  id-token: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      published: ${{ steps.run.outputs.published }}
    steps:
      # A run that waited in the queue behind another must see that run's post, or it writes a second one.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # The generator already retries the writing step once and skips the day cleanly if the
      # retry fails too. This outer retry covers a crash (network outage, provider down): one more
      # try after two minutes, then a clean skip with a warning instead of a red run.
      - name: Write today's post
        id: run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m fma daily || { sleep 120; python -m fma daily; } || {
            echo "::warning::Skipped today: the generator crashed twice. Nothing was published."
            echo "published=false" >> "$GITHUB_OUTPUT"
          }

      # The day's social approval queue (Instagram, X, LinkedIn texts), shown in the control dashboard.
      # Building it never blocks the post.
      - name: Social queue
        if: steps.run.outputs.published == 'true'
        run: python -m fma.social_queue build || echo "::warning::Social queue not built"

      - name: Commit the post
        if: steps.run.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content data
          git commit -m "Post for $(TZ=Asia/Kolkata date +%F)"
          # main may have moved during the 10-40 minute run (a manual fix, say): replay on top and retry.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1

      # The last backup of the day turns a missed day into a red run, so GitHub emails about it.
      - name: Alert if there is still no post today
        if: always() && github.event.schedule == '37 6 * * *'
        run: |
          git pull -q origin main || true
          day=$(TZ=Asia/Kolkata date +%F)
          if [ ! -f "content/posts/$day.json" ]; then
            echo "::error::No post for $day after all the scheduled tries. See the 'Write today's post' step above."
            exit 1
          fi

  deploy:
    needs: generate
    if: needs.generate.outputs.published == 'true'
    uses: ./.github/workflows/deploy.yml

  # The crons are the clock's backup: if no clock run is going (a lost runner, a GitHub outage), start one.
  clock-watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Restart the clock if it stopped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          going=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow clock.yml --limit 5 --json status -q '[.[] | select(.status != "completed")] | length')
          if [ "$going" = "0" ]; then
            echo "::warning::The clock had stopped; restarting it"
            gh workflow run clock.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "Clock is running"
          fi
