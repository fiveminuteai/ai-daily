# Where Five Minute AI looks for news. Edit this file to add or remove sources.
#
# kind:     rss | hn | hf_papers | github
# weight:   how much one item from this source counts when ranking (1.0 = normal)
# category: default section tag for items from this source
# ai_filter: true = keep only items that mention AI terms (for general tech sources)
# primary:  true = the organisation's own announcement (preferred as the cited source)
#
# Labs without a public RSS feed (Anthropic, Meta AI, Mistral at the time of writing)
# still show up through the news sources and Hacker News.

sources:
  # --- AI labs and company blogs (primary sources) ---
  - {id: openai,      name: OpenAI,             kind: rss, url: "https://openai.com/news/rss.xml",                         weight: 1.6, category: models,   primary: true}
  - {id: deepmind,    name: Google DeepMind,    kind: rss, url: "https://deepmind.google/blog/rss.xml",                    weight: 1.5, category: research, primary: true}
  - {id: google-ai,   name: Google AI blog,     kind: rss, url: "https://blog.google/technology/ai/rss/",                  weight: 1.2, category: products, primary: true}
  - {id: msr,         name: Microsoft Research, kind: rss, url: "https://www.microsoft.com/en-us/research/feed/",          weight: 1.0, category: research, primary: true, ai_filter: true}
  - {id: nvidia,      name: NVIDIA blog,        kind: rss, url: "https://blogs.nvidia.com/feed/",                          weight: 0.9, category: products, primary: true, ai_filter: true}
  - {id: aws-ml,      name: AWS Machine Learning, kind: rss, url: "https://aws.amazon.com/blogs/machine-learning/feed/",    weight: 0.6, category: products, primary: true}
  - {id: google-research, name: Google Research, kind: rss, url: "https://research.google/blog/rss/",              weight: 1.2, category: research, primary: true}
  - {id: hf-blog,     name: Hugging Face blog,  kind: rss, url: "https://huggingface.co/blog/feed.xml",                    weight: 1.1, category: tools,    primary: true}

  # --- Research ---
  - {id: hf-papers,   name: Hugging Face Daily Papers, kind: hf_papers, url: "https://huggingface.co/api/daily_papers",   weight: 1.0, category: research, primary: true, outlet: arXiv, strict_match: true}
  - {id: arxiv-ai,    name: arXiv cs.AI,        kind: rss, url: "https://rss.arxiv.org/rss/cs.AI",                         weight: 0.15, category: research, primary: true, max_items: 60, outlet: arXiv, strict_match: true}
  - {id: arxiv-cl,    name: arXiv cs.CL,        kind: rss, url: "https://rss.arxiv.org/rss/cs.CL",                         weight: 0.15, category: research, primary: true, max_items: 60, outlet: arXiv, strict_match: true}
  - {id: arxiv-lg,    name: arXiv cs.LG,        kind: rss, url: "https://rss.arxiv.org/rss/cs.LG",                         weight: 0.15, category: research, primary: true, max_items: 60, outlet: arXiv, strict_match: true}

  # --- Model architecture: model cards, technical write-ups ---
  # New models' own cards on Hugging Face (trending, created in the last 7 days, quantised repacks skipped).
  - {id: hf-models,   name: Hugging Face model cards, kind: hf_models, url: "https://huggingface.co/api/models?sort=trendingScore&direction=-1&limit=40&full=true", weight: 0.9, category: architecture, primary: true, min_likes: 150, lookback_hours: 96}
  - {id: raschka,     name: Ahead of AI (Sebastian Raschka), kind: rss, url: "https://magazine.sebastianraschka.com/feed", weight: 1.0, category: architecture}
  - {id: lilianweng,  name: Lil'Log (Lilian Weng), kind: rss, url: "https://lilianweng.github.io/index.xml", weight: 1.0, category: architecture}

  # --- Reputable tech news ---
  - {id: verge-ai,    name: The Verge,          kind: rss, url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", weight: 1.1, category: products}
  - {id: techcrunch,  name: TechCrunch,         kind: rss, url: "https://techcrunch.com/category/artificial-intelligence/feed/",     weight: 1.1, category: products}
  - {id: ars-ai,      name: Ars Technica,       kind: rss, url: "https://arstechnica.com/ai/feed/",                        weight: 1.1, category: impact}
  - {id: mittr-ai,    name: MIT Technology Review, kind: rss, url: "https://www.technologyreview.com/topic/artificial-intelligence/feed", weight: 1.2, category: impact}
  - {id: wired-ai,    name: WIRED,              kind: rss, url: "https://www.wired.com/feed/tag/ai/latest/rss",            weight: 1.0, category: impact}
  - {id: ieee-ai,     name: IEEE Spectrum,      kind: rss, url: "https://spectrum.ieee.org/feeds/topic/artificial-intelligence.rss", weight: 0.9, category: research}
  # VentureBeat rate-limits automated readers (HTTP 429), so it is off for now.
  - {id: venturebeat, name: VentureBeat,        kind: rss, url: "https://venturebeat.com/category/ai/feed/",               weight: 0.9, category: products, enabled: false}

  # --- Community signals ---
  - {id: hn,          name: Hacker News,        kind: hn,  url: "https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=60", weight: 0.8, category: tools, ai_filter: true}
  - {id: github,      name: GitHub,             kind: github, url: "https://api.github.com/search/repositories", weight: 0.5, category: tools, min_stars: 150}

# Words that mark an item as AI-related (used where ai_filter is true). Matched as whole words, case-insensitive.
ai_terms: [AI, A.I., LLM, LLMs, GPT, ChatGPT, Gemini, Claude, Anthropic, OpenAI, DeepMind, Llama, Mistral, Qwen, DeepSeek,
  "machine learning", "deep learning", "neural", "language model", "language models", transformer, diffusion, agent, agents,
  agentic, chatbot, Copilot, "artificial intelligence", inference, GPU, GPUs, "foundation model", multimodal, robotics, "AI safety"]

# Titles matching these patterns (regex, case-insensitive) are customer stories, tutorials or
# marketing rather than news; their score is halved.
demote_patterns:
  - "^how .+ (uses?|used|cut|cuts|streamlines?|builds?|scales?|turned|helps?) "
  - " helps .+ (strengthen|cut|build|scale|streamline)"
  - "with (chatgpt|gpt-[\\d.]+\\w*|amazon bedrock|sagemaker|gemini)( |$)"
  - "^(build|building|deploy|deploying|fine-tune|getting started)\\b"
  - "customer story|case study|webinar|recap"

# A lab's own announcement matching these (regex, case-insensitive) is a release; it gets a bonus.
boost_patterns:
  - "^introducing "
  - "^(announcing|meet) "
  - "\\b(releases?|launch(es)?|now available|open[- ]sourc(es|ing)|open weights?)\\b"

# Words in a title that hint at the section an item belongs to. Architecture is checked first for papers,
# so a paper about a new attention scheme lands under Architecture rather than generic Research.
category_hints:
  architecture: [architecture, transformer, transformers, attention, mixture-of-experts, MoE, experts, state-space, SSM, Mamba,
                 hybrid, long-context, "context window", "linear attention", "sparse attention", recurrent, quantization,
                 quantisation, quantized, distillation, distilled, pruning, "test-time compute", "test-time", "reasoning model",
                 tokenizer, "KV cache", "speculative decoding", "model card", "technical report", pretraining, "training recipe",
                 multimodal, "small model", "small language model", parameters, "diffusion language"]
  policy:   [law, "AI Act", security, vulnerability, exposure, leak, leaked, breach, exploit, regulation, regulator, senate, congress, EU, court, lawsuit, ban, safety, copyright, policy, government, IPO, S-1, prospectus]
  models:   [release, releases, launches, launch, model, models, open-weight, weights, benchmark, GPT, Gemini, Claude, Llama, Qwen]
  research: [paper, study, researchers, arxiv, dataset, discovery, breakthrough, method]
  products: [app, feature, available, rolls, rollout, pricing, subscription, assistant, Siri, Copilot]
  tools:    [open-source, library, framework, SDK, repo, GitHub, API, tool, toolkit]
  impact:   [jobs, workers, schools, hospital, health, climate, energy, students, economy]
