# Site and pipeline settings for Five Minute AI.

name: Five Minute AI
tagline: The day in AI, sourced and short. One post a day, about five minutes.
byline: Sai Pavan UE
base_url: https://fiveminuteai.net/   # full public URL, ending in /
repo_url: https://github.com/fiveminuteai/ai-daily
language: en
goatcounter: fiveminuteai   # private, cookie-free visit counts (dashboard: fiveminuteai.goatcounter.com); remove to turn off
timezone: Asia/Kolkata        # post dates follow this timezone

# Social accounts, shown in the footer and on the About page
social:
  - {name: Instagram, handle: "@fiveminute_ai", url: "https://www.instagram.com/fiveminute_ai/"}
  - {name: LinkedIn, handle: Five Minute AI, url: "https://www.linkedin.com/company/fiveminuteai/"}
  - {name: X, handle: "@fiveminute_ai", url: "https://x.com/fiveminute_ai"}
# @fiveminute_ai's Instagram account ID (public, not a secret). Stats and posting use it with the INSTAGRAM_TOKEN
# secret, a system-user token from the Meta app "Five Minute AI publisher" in the Five Minute AI business portfolio.
instagram_id: "17841454265938310"

# Set to true to stop daily posts without touching the workflow.
paused: false
# Story Reels post at 09:00, 13:00 and 19:00 India time without waiting for approval (Pavan, 1 Nov 2026).
# Skip a Reel in the control app before its time to stop it. Set to false to approve each one by hand again.
auto_post_reels: true

# Who reads this, and what they find interesting. The daily editor pass uses this to pick stories.
audience:
  description: >-
    Smart working professionals in India, mostly in tech and cybersecurity, who use AI tools at work but are not AI
    researchers. They read on their phones in the morning.
  interests:
    - "Big launches and wow demos: new models, world simulators, surprising new capabilities"
    - "Tools we can use at work: AI features arriving in apps people already use"
    - "Big-tech moves and controversy: company shake-ups, money, lawsuits, copyright, policy fights"
    - "Security and India: AI in cybersecurity, Indian AI companies, policy and talent"
  editor_weight: 1.5          # how much the editor's interest score counts against the importance score

pipeline:
  lookback_hours: 40          # only consider items published in this window
  stories_per_post: 5         # 3-5 sections
  min_stories: 3
  dedupe_days: 14             # never re-cover a URL seen in this many days
  similar_title_days: 3       # never re-cover a near-identical story from the last N days
  words_min: 880
  words_max: 1150
  max_quotes: 1
  llm_check: true             # second verification layer: the model re-reads sources and flags unsupported sentences
  attempts: 2                 # first try + one retry, then skip the day

# Model providers, tried in order. A provider is used only if its key is set in the environment.
# Keys live in GitHub secrets or local environment variables, never in this file.
providers:
  # Groq free plan (chosen 28 Oct 2026). Limits read from console.groq.com/docs/rate-limits that day:
  # gpt-oss-120b 30 requests/min, 1K/day, 8K tokens/min, 200K tokens/day. A post uses ~12 calls and ~50K tokens,
  # so calls are spaced 30 s apart and reasoning is kept short.
  - {name: groq, base_url: "https://api.groq.com/openai/v1/", model: openai/gpt-oss-120b, key_env: GROQ_API_KEY,
     min_interval_s: 30, extra: {reasoning_effort: low, max_completion_tokens: 2500}}
  - {name: gemini, base_url: "https://generativelanguage.googleapis.com/v1beta/openai/", model: gemini-3.8-flash, key_env: GEMINI_API_KEY}
  - {name: openrouter, base_url: "https://openrouter.ai/api/v1/", model: "openai/gpt-oss-120b:free", key_env: OPENROUTER_API_KEY}
  - {name: ollama, base_url: "http://localhost:11434", model: "qwen2.5:14b", key_env: null, local: true}
